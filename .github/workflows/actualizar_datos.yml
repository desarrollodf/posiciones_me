name: Actualizar datos

on:
  workflow_dispatch:

  schedule:
    - cron: '30 8 * * 1-5'
      timezone: 'America/Santiago'

permissions:
  contents: write
  
concurrency:
  group: actualizar-datos
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Actualizar datos
        env:
          BCCH_USER: ${{ secrets.BCCH_USER }}
          BCCH_PASSWORD: ${{ secrets.BCCH_PASSWORD }}
        run: python actualizar_datos.py

      - name: Guardar datos actualizados
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp datos.xlsx /tmp/datos.xlsx

          for intento in 1 2 3; do
            echo "Intento ${intento} de guardar datos"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/datos.xlsx datos.xlsx
            git add datos.xlsx

            if git diff --cached --quiet; then
              echo 'No hay cambios en datos.xlsx'
              exit 0
            fi

            git commit -m 'Actualizar datos automaticamente'

            if git push origin main; then
              echo 'Push realizado correctamente'
              exit 0
            fi

            echo 'El remoto cambio durante el push. Reintentando...'
            sleep 5
          done

          echo 'No fue posible actualizar main despues de 3 intentos'
          exit 1